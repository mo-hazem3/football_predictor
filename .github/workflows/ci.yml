name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Django system check
        run: python backend/manage.py check
      - name: OpenAPI schema generates and validates
        run: python backend/manage.py spectacular --validate --file /tmp/openapi.yaml
