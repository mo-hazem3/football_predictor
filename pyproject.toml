[project]
name = "football-comps"
version = "0.1.0"
description = "Find statistically similar football players and project career trajectories as probability ranges."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "rapidfuzz>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
fbref = ["soccerdata>=1.8"]
viz = ["matplotlib>=3.8", "adjustText>=1.1"]
dev = ["pytest>=8.0", "matplotlib>=3.8", "adjustText>=1.1"]

[tool.setuptools.packages.find]
include = ["data_pipeline*", "features*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
