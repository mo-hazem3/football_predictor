[project]
name = "football-comps"
version = "0.1.0"
description = "Find statistically similar football players and project career trajectories as probability ranges."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "rapidfuzz>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
fbref = ["soccerdata>=1.8"]
viz = ["matplotlib>=3.8", "adjustText>=1.1"]
backend = ["django>=5.2,<6", "djangorestframework>=3.15", "drf-spectacular>=0.27", "django-cors-headers>=4.3"]
dev = ["pytest>=8.0", "pytest-django>=4.8", "matplotlib>=3.8", "adjustText>=1.1",
       "django>=5.2,<6", "djangorestframework>=3.15", "drf-spectacular>=0.27", "django-cors-headers>=4.3"]

[tool.setuptools.packages.find]
include = ["data_pipeline*", "features*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "backend"]
DJANGO_SETTINGS_MODULE = "config.settings_test"
filterwarnings = ["ignore::DeprecationWarning:rest_framework.*"]
